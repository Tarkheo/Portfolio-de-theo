<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetris</title>
    <link rel="icon" type="image/png" href="images/favicon.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Arrière-plan Violet Profond / Noir */
        body {
            font-family: 'Poppins', 'Arial', sans-serif;
            background: linear-gradient(135deg, #2b0f4c 0%, #0d0415 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: white;
            overflow: hidden;
        }

        /* ============================================
           BOUTON RETOUR : STYLE INVITE DE COMMANDE DORÉ
           ============================================ */
        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1000;
            background: #050505;
            border: 2px solid #D4AF37; 
            color: #D4AF37; 
            padding: 15px 30px;
            border-radius: 4px;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            font-family: 'Consolas', 'Courier New', monospace;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 4px 4px 0px rgba(212, 175, 55, 0.3);
        }

        .back-btn::after {
            content: "_";
            animation: blinkCursor 1s step-end infinite;
        }

        @keyframes blinkCursor {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .back-btn:hover {
            background: rgba(212, 175, 55, 0.1);
            box-shadow: 6px 6px 0px rgba(212, 175, 55, 0.5);
            transform: translate(-2px, -2px);
        }

        .back-btn:active {
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0px rgba(212, 175, 55, 0);
        }

        /* ============================================
           INTERFACE DU JEU
           ============================================ */
        .container {
            text-align: center;
            background: rgba(15, 5, 25, 0.6); /* Fond légèrement violet/noir transparent */
            padding: 30px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(212, 175, 55, 0.2);
        }

        h1 {
            margin-bottom: 20px;
            font-size: 3em;
            color: #D4AF37; /* Titre Doré */
            text-shadow: 2px 2px 10px rgba(212, 175, 55, 0.3);
            font-family: 'Consolas', 'Courier New', monospace;
        }

        .game-info {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            font-size: 1.2em;
            color: #e0e0e0;
        }

        .info-item {
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid rgba(212, 175, 55, 0.3);
            padding: 10px 20px;
            border-radius: 10px;
            color: #D4AF37;
        }

        .info-item span {
            color: white;
            font-weight: bold;
        }

        #gameCanvas {
            border: 3px solid #D4AF37; /* Bordure du jeu dorée */
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(212, 175, 55, 0.2);
            display: block;
            margin: 0 auto;
            background-color: #0a0a0a;
        }

        .controls {
            margin-top: 20px;
            font-size: 0.9em;
            opacity: 0.8;
            color: #b0a8ba; /* Texte violet très clair */
        }

        /* Boutons d'action (Nouvelle Partie, Rejouer) harmonisés en Doré */
        .btn {
            background: rgba(15, 15, 15, 0.85);
            border: 2px solid #D4AF37;
            color: #D4AF37;
            padding: 10px 30px;
            border-radius: 25px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            margin-top: 15px;
            transition: all 0.3s;
            font-family: 'Poppins', sans-serif;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }

        .btn:hover {
            background: #D4AF37;
            color: #111111;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.4);
        }

        #gameOver {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(15, 5, 25, 0.95);
            padding: 40px;
            border-radius: 20px;
            border: 2px solid #D4AF37;
            box-shadow: 0 0 50px rgba(212, 175, 55, 0.3);
            z-index: 1000;
            text-align: center;
        }

        #gameOver h2 {
            font-size: 2.5em;
            margin-bottom: 20px;
            color: #D4AF37;
        }
        
        #gameOver p {
            font-size: 1.2em;
            margin-bottom: 20px;
        }

        #finalScore {
            color: #D4AF37;
            font-weight: bold;
            font-size: 1.5em;
        }

        /* Responsive pour les petits écrans */
        @media (max-width: 768px) {
            .back-btn {
                padding: 10px 20px;
                font-size: 1em;
                box-shadow: 3px 3px 0px rgba(212, 175, 55, 0.3);
            }
            h1 {
                font-size: 2.2em;
            }
            .game-info {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <button class="back-btn" onclick="window.history.back()">← Retour</button>
    
    <div class="container">
        <h1><svg class="lucide" xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:middle"><line x1="6" x2="10" y1="12" y2="12"/><line x1="8" x2="8" y1="10" y2="14"/><line x1="15" x2="15.01" y1="13" y2="13"/><line x1="18" x2="18.01" y1="11" y2="11"/><rect width="20" height="12" x="2" y="6" rx="2"/></svg> TETRIS</h1>
        
        <div class="game-info">
            <div class="info-item">
                Score: <span id="score">0</span>
            </div>
            <div class="info-item">
                Niveau: <span id="level">1</span>
            </div>
            <div class="info-item">
                Lignes: <span id="lines">0</span>
            </div>
        </div>

        <canvas id="gameCanvas" width="300" height="600"></canvas>

        <div class="controls">
            <p>⬅️ ➡️ Déplacer | ⬇️ Descendre | ⬆️ Rotation | ESPACE Pause</p>
        </div>

        <button class="btn" onclick="restartGame()">Nouvelle Partie</button>
    </div>

    <div id="gameOver">
        <h2>Game Over!</h2>
        <p>Score final: <span id="finalScore">0</span></p>
        <button class="btn" onclick="restartGame()">Rejouer</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const ROWS = 20;
        const COLS = 10;
        const BLOCK_SIZE = 30;

        let board = Array(ROWS).fill().map(() => Array(COLS).fill(0));
        let score = 0;
        let lines = 0;
        let level = 1;
        let gameSpeed = 1000;
        let gameInterval;
        let isPaused = false;
        let currentPiece;
        let gameRunning = false;

        const PIECES = [
            [[1,1,1,1]], // I
            [[1,1],[1,1]], // O
            [[0,1,0],[1,1,1]], // T
            [[1,0,0],[1,1,1]], // L
            [[0,0,1],[1,1,1]], // J
            [[0,1,1],[1,1,0]], // S
            [[1,1,0],[0,1,1]]  // Z
        ];

        const COLORS = [
            '#00f0f0', // cyan
            '#f0f000', // yellow
            '#a000f0', // purple
            '#f0a000', // orange
            '#0000f0', // blue
            '#00f000', // green
            '#f00000'  // red
        ];

        class Piece {
            constructor() {
                this.typeId = Math.floor(Math.random() * PIECES.length);
                this.shape = PIECES[this.typeId];
                this.color = COLORS[this.typeId];
                this.x = Math.floor(COLS / 2) - Math.floor(this.shape[0].length / 2);
                this.y = 0;
            }

            draw() {
                ctx.fillStyle = this.color;
                for (let row = 0; row < this.shape.length; row++) {
                    for (let col = 0; col < this.shape[row].length; col++) {
                        if (this.shape[row][col]) {
                            ctx.fillRect(
                                (this.x + col) * BLOCK_SIZE,
                                (this.y + row) * BLOCK_SIZE,
                                BLOCK_SIZE - 1,
                                BLOCK_SIZE - 1
                            );
                            // Ajout d'une petite bordure pour un effet plus net des blocs
                            ctx.strokeStyle = 'rgba(0,0,0,0.5)';
                            ctx.strokeRect(
                                (this.x + col) * BLOCK_SIZE,
                                (this.y + row) * BLOCK_SIZE,
                                BLOCK_SIZE - 1,
                                BLOCK_SIZE - 1
                            );
                        }
                    }
                }
            }

            move(dx, dy) {
                this.x += dx;
                this.y += dy;
                if (this.collision()) {
                    this.x -= dx;
                    this.y -= dy;
                    return false;
                }
                return true;
            }

            rotate() {
                const rotated = this.shape[0].map((_, i) => 
                    this.shape.map(row => row[i]).reverse()
                );
                const prevShape = this.shape;
                this.shape = rotated;
                if (this.collision()) {
                    this.shape = prevShape;
                }
            }

            collision() {
                for (let row = 0; row < this.shape.length; row++) {
                    for (let col = 0; col < this.shape[row].length; col++) {
                        if (this.shape[row][col]) {
                            const newX = this.x + col;
                            const newY = this.y + row;
                            if (newX < 0 || newX >= COLS || newY >= ROWS) {
                                return true;
                            }
                            if (newY >= 0 && board[newY][newX]) {
                                return true;
                            }
                        }
                    }
                }
                return false;
            }

            lock() {
                for (let row = 0; row < this.shape.length; row++) {
                    for (let col = 0; col < this.shape[row].length; col++) {
                        if (this.shape[row][col]) {
                            const boardY = this.y + row;
                            const boardX = this.x + col;
                            if (boardY >= 0) {
                                board[boardY][boardX] = this.color;
                            }
                        }
                    }
                }
            }
        }

        function drawBoard() {
            // Fond du canvas très légèrement transparent pour laisser deviner le fond du site
            ctx.fillStyle = 'rgba(10, 10, 15, 0.9)'; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let row = 0; row < ROWS; row++) {
                for (let col = 0; col < COLS; col++) {
                    if (board[row][col]) {
                        ctx.fillStyle = board[row][col];
                        ctx.fillRect(
                            col * BLOCK_SIZE,
                            row * BLOCK_SIZE,
                            BLOCK_SIZE - 1,
                            BLOCK_SIZE - 1
                        );
                        ctx.strokeStyle = 'rgba(0,0,0,0.5)';
                        ctx.strokeRect(
                            col * BLOCK_SIZE,
                            row * BLOCK_SIZE,
                            BLOCK_SIZE - 1,
                            BLOCK_SIZE - 1
                        );
                    }
                }
            }
        }

        function clearLines() {
            let linesCleared = 0;
            for (let row = ROWS - 1; row >= 0; row--) {
                if (board[row].every(cell => cell !== 0)) {
                    board.splice(row, 1);
                    board.unshift(Array(COLS).fill(0));
                    linesCleared++;
                    row++;
                }
            }
            if (linesCleared > 0) {
                lines += linesCleared;
                score += linesCleared * 100 * level;
                level = Math.floor(lines / 10) + 1;
                gameSpeed = Math.max(100, 1000 - (level - 1) * 100);
                updateDisplay();
                restartInterval();
            }
        }

        function updateDisplay() {
            document.getElementById('score').textContent = score;
            document.getElementById('level').textContent = level;
            document.getElementById('lines').textContent = lines;
        }

        function gameLoop() {
            if (!isPaused && gameRunning) {
                if (!currentPiece.move(0, 1)) {
                    currentPiece.lock();
                    clearLines();
                    currentPiece = new Piece();
                    if (currentPiece.collision()) {
                        gameOver();
                        return;
                    }
                }
                drawBoard();
                currentPiece.draw();
            }
        }

        function restartInterval() {
            clearInterval(gameInterval);
            gameInterval = setInterval(gameLoop, gameSpeed);
        }

        function startGame() {
            board = Array(ROWS).fill().map(() => Array(COLS).fill(0));
            score = 0;
            lines = 0;
            level = 1;
            gameSpeed = 1000;
            isPaused = false;
            gameRunning = true;
            currentPiece = new Piece();
            updateDisplay();
            document.getElementById('gameOver').style.display = 'none';
            restartInterval();
        }

        function gameOver() {
            gameRunning = false;
            clearInterval(gameInterval);
            document.getElementById('finalScore').textContent = score;
            document.getElementById('gameOver').style.display = 'block';
        }

        function restartGame() {
            startGame();
        }

        document.addEventListener('keydown', (e) => {
            if (!gameRunning) return;
            
            // Empêcher le défilement de la page avec les flèches
            if(['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].indexOf(e.code) > -1) {
                e.preventDefault();
            }
            
            switch(e.key) {
                case 'ArrowLeft':
                    currentPiece.move(-1, 0);
                    break;
                case 'ArrowRight':
                    currentPiece.move(1, 0);
                    break;
                case 'ArrowDown':
                    currentPiece.move(0, 1);
                    break;
                case 'ArrowUp':
                    currentPiece.rotate();
                    break;
                case ' ':
                    isPaused = !isPaused;
                    break;
            }
            if (!isPaused) {
                drawBoard();
                currentPiece.draw();
            }
        });

        startGame();
    </script>
</body>
</html>
